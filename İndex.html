<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>METE CITY 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc7e8;font-family:Arial,sans-serif;touch-action:none}canvas{display:block}
#brand{position:fixed;left:16px;top:14px;color:#fff;text-shadow:0 2px 8px #14202b;font-weight:900;letter-spacing:3px;font-size:22px;pointer-events:none}#subtitle{font-size:11px;letter-spacing:1px;color:#e9f7ff;margin-top:4px}
#speed{position:fixed;right:18px;bottom:18px;color:#fff;font-weight:900;font-size:25px;text-shadow:0 2px 8px #000;pointer-events:none}
#quality{position:fixed;left:14px;top:70px;border:1px solid #ffffff70;border-radius:12px;background:#102234b8;color:#fff;padding:8px 10px;font-size:12px}
#map{position:fixed;right:14px;top:14px;width:128px;height:128px;border-radius:50%;border:2px solid #ffffffb0;background:#10202bd9;box-shadow:0 3px 15px #0007}
#mission{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#142536d9;color:#fff;border:1px solid #ffffff55;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:bold;white-space:nowrap}
#controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px;pointer-events:none}
.group{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}.pedals{flex-direction:column}
.ctrl{width:66px;height:66px;border:1px solid #ffffffa8;border-radius:22px;background:linear-gradient(145deg,#263e50eF,#101d2beF);color:white;font-weight:900;font-size:20px;box-shadow:0 5px 16px #0006,inset 0 1px 0 #ffffff35;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.active{filter:brightness(1.35);transform:scale(.96)}.gas{background:linear-gradient(145deg,#31b86c,#12633d);height:72px}.brake{background:linear-gradient(145deg,#e65c57,#8b2028);height:62px}.steer{font-size:25px}
#hint{position:fixed;left:50%;bottom:165px;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#10202bc9;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
@media(max-width:600px){#map{width:104px;height:104px}#brand{font-size:18px}#quality{top:58px}.ctrl{width:58px;height:58px;border-radius:19px}.gas{height:66px}.brake{height:56px}#hint{bottom:150px}}
</style>
</head>
<body>
<div id="brand">METE CITY 3D<div id="subtitle">OPEN WORLD DRIVE</div></div>
<select id="quality" aria-label="Grafik kalitesi"><option value="auto">Grafik: Otomatik</option><option value="low">Grafik: Düşük</option><option value="medium">Grafik: Orta</option><option value="high">Grafik: Yüksek</option></select>
<canvas id="map" width="256" height="256"></canvas>
<div id="mission">🅰 A — Görev başlangıç noktası</div>
<div id="speed">0 km/sa</div><div id="hint">A noktasına git · WASD veya ekrandaki pedallar</div>
<div id="controls">
 <div class="group"><button class="ctrl steer" data-key="a" aria-label="Sola dön">◀</button><button class="ctrl steer" data-key="d" aria-label="Sağa dön">▶</button></div>
 <div class="group pedals"><button class="ctrl gas" data-key="w">▲<br><small style="font-size:11px">GAZ</small></button><button class="ctrl brake" data-key="s">▼<br><small style="font-size:10px">FREN</small></button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcfe9);scene.fog=new THREE.Fog(0x9bcfe9,230,850);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
const qualitySelect=document.getElementById('quality');let quality='medium';
function setQuality(q){if(q==='auto'){const mem=navigator.deviceMemory||4; q=(innerWidth<700||mem<=3)?'low':mem>=8?'high':'medium'}quality=q;const d={low:{pixel:1,shadows:false,trees:0.65},medium:{pixel:1.4,shadows:true,trees:1},high:{pixel:Math.min(devicePixelRatio,2),shadows:true,trees:1.5}}[q];renderer.setPixelRatio(d.pixel);renderer.shadowMap.enabled=d.shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;sun.castShadow=d.shadows;sun.shadow.mapSize.set(q==='high'?2048:1024,q==='high'?2048:1024);renderer.setSize(innerWidth,innerHeight);}
qualitySelect.addEventListener('change',()=>setQuality(qualitySelect.value));setQuality('auto');
scene.add(new THREE.HemisphereLight(0xe7f6ff,0x52634c,2.1));const sun=new THREE.DirectionalLight(0xfff0d5,2.5);sun.position.set(-120,180,90);sun.castShadow=true;sun.shadow.camera.left=-260;sun.shadow.camera.right=260;sun.shadow.camera.top=260;sun.shadow.camera.bottom=-260;scene.add(sun);
const material=(c,r=.82)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),material(0x65965a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=material(0x343a40),lineMat=material(0xf5e8bd),sideMat=material(0xb6b4a9);
for(let i=-5;i<=5;i++){let p=i*100;for(const horizontal of [false,true]){const m=new THREE.Mesh(new THREE.PlaneGeometry(24,1000),roadMat);m.rotation.x=-Math.PI/2;if(horizontal)m.rotation.z=Math.PI/2;m.position.set(horizontal?0:p,.035,horizontal?p:0);m.receiveShadow=true;scene.add(m);const s=new THREE.Mesh(new THREE.PlaneGeometry(3,1000),sideMat);s.rotation.x=-Math.PI/2;if(horizontal)s.rotation.z=Math.PI/2;s.position.set(horizontal?0:p+14,.025,horizontal?p+14:0);scene.add(s)}for(let t=-480;t<500;t+=28){const dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,11),lineMat);dash.position.set(p,.065,t);scene.add(dash);const dash2=new THREE.Mesh(new THREE.BoxGeometry(11,.035,.22),lineMat);dash2.position.set(t,.066,p);scene.add(dash2)}}
// Colourful, varied city blocks
const colors=[0xd69b70,0x77a9b7,0xe4c77e,0x9c8bb7,0x83aa82,0xd18b88,0xc3c8c5,0x8cabbf,0xd6b2a0];const buildings=[];
for(let gx=-4;gx<4;gx++)for(let gz=-4;gz<4;gz++){for(let k=0;k<3;k++){const x=gx*100+(k-1)*25,z=gz*100+(k%2?27:-27),w=16+(k%2)*4,d=18+(k%3)*3,h=22+((gx*17+gz*11+k*23+1000)%6)*11;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(colors[Math.abs(gx*7+gz*3+k)%colors.length]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);buildings.push({x,z,w,d});const roof=new THREE.Mesh(new THREE.BoxGeometry(w*.88,.8,d*.88),material(0x555b60));roof.position.set(x,h+.4,z);scene.add(roof);
// front windows
for(let yy=5;yy<h-3;yy+=6)for(let xx=-w/2+3;xx<w/2-1;xx+=5){const win=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.4,.16),material(0x9fd3e5,.35));win.position.set(x+xx,yy,z+d/2+.1);scene.add(win)}
}}
function tree(x,z,scale=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45*scale,.65*scale,4*scale,7),material(0x765034));trunk.position.set(x,2*scale,z);trunk.castShadow=true;scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(3.5*scale,9,8),material(0x347747));crown.position.set(x,5.5*scale,z);crown.castShadow=true;scene.add(crown)}
for(let x=-450;x<=450;x+=32)for(let z=-450;z<=450;z+=32)if(Math.abs(x%100)>20&&Math.abs(z%100)>20&&((x*7+z*3)%5===0))tree(x,z,.8);
// Player vehicle
const car=new THREE.Group();scene.add(car);const red=material(0x17212b,.34),glass=material(0x77aebd,.22),rubber=material(0x111315),chrome=material(0x9ba7ac,.3);
const chassis=new THREE.Mesh(new THREE.BoxGeometry(4.4,1.15,7.3),red);chassis.position.y=1.18;chassis.castShadow=true;car.add(chassis);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(3.35,1.45,3.55),glass);cabin.position.set(0,2.35,-.35);cabin.castShadow=true;car.add(cabin);
const roof=new THREE.Mesh(new THREE.BoxGeometry(3.4,.18,3.5),red);roof.position.set(0,3.12,-.35);car.add(roof);
for(const x of [-2.22,2.22])for(const z of [-2.35,2.35]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.48,20),rubber);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.78,z);wheel.castShadow=true;car.add(wheel);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.5,16),chrome);hub.rotation.z=Math.PI/2;hub.position.set(x,.78,z);car.add(hub)}
const headMat=material(0xfff1c4,.3);for(const x of [-1.45,1.45]){const l=new THREE.Mesh(new THREE.BoxGeometry(.7,.3,.12),headMat);l.position.set(x,1.35,-3.7);car.add(l)}
const tailMat=material(0xe52e29);for(const x of [-1.45,1.45]){const l=new THREE.Mesh(new THREE.BoxGeometry(.7,.3,.12),tailMat);l.position.set(x,1.35,3.7);car.add(l)}
car.position.set(0,0,15);let speed=0,heading=0;const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='r'){car.position.set(0,0,15);speed=0;heading=0}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;btn.classList.add('active');btn.setPointerCapture(e.pointerId)});const release=()=>{keys[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release)});
// Mission marker A
const marker=new THREE.Group();scene.add(marker);marker.position.set(150,0,-150);const ring=new THREE.Mesh(new THREE.TorusGeometry(5,.45,8,32),material(0xffd52a,.4));ring.rotation.x=Math.PI/2;ring.position.y=.3;marker.add(ring);const letter=document.createElement('canvas');letter.width=128;letter.height=128;const ctx=letter.getContext('2d');ctx.fillStyle='#ffd52a';ctx.font='bold 100px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('A',64,65);const tex=new THREE.CanvasTexture(letter);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sprite.scale.set(10,10,1);sprite.position.y=12;marker.add(sprite);
const map=document.getElementById('map'),mctx=map.getContext('2d');function drawMap(){mctx.clearRect(0,0,256,256);mctx.fillStyle='#213c35';mctx.fillRect(0,0,256,256);mctx.strokeStyle='#687a7b';mctx.lineWidth=7;for(let i=0;i<11;i++){let p=8+i*24;mctx.beginPath();mctx.moveTo(p,0);mctx.lineTo(p,256);mctx.stroke();mctx.beginPath();mctx.moveTo(0,p);mctx.lineTo(256,p);mctx.stroke()}mctx.fillStyle='#ffd52a';mctx.font='bold 28px Arial';mctx.textAlign='center';mctx.fillText('A',128+(marker.position.x-car.position.x)*.45,128+(marker.position.z-car.position.z)*.45);mctx.save();mctx.translate(128,128);mctx.rotate(-heading);mctx.fillStyle='#52d7ff';mctx.beginPath();mctx.moveTo(0,-10);mctx.lineTo(-7,8);mctx.lineTo(7,8);mctx.closePath();mctx.fill();mctx.restore();}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);const forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft,right=keys.d||keys.arrowright,hand=keys[' '];if(forward)speed+=22*dt;if(back)speed-=32*dt;speed*=Math.pow(hand?.91:.986,dt*60);speed=THREE.MathUtils.clamp(speed,-17,48);const steer=(right?1:0)-(left?1:0);heading+=steer*(.55+Math.min(Math.abs(speed)/18,1)*1.15)*Math.sign(speed||1)*dt*(hand?1.2:1);car.position.x+=Math.sin(heading)*speed*dt;car.position.z-=Math.cos(heading)*speed*dt;car.position.x=THREE.MathUtils.clamp(car.position.x,-470,470);car.position.z=THREE.MathUtils.clamp(car.position.z,-470,470);car.rotation.y=heading;
for(const b of buildings)if(Math.abs(car.position.x-b.x)<b.w/2+2.4&&Math.abs(car.position.z-b.z)<b.d/2+3){car.position.x-=Math.sin(heading)*speed*dt*2;car.position.z+=Math.cos(heading)*speed*dt*2;speed*=-.2}
const desired=new THREE.Vector3(car.position.x+Math.sin(heading)*17,10.5,car.position.z+Math.cos(heading)*17);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(car.position.x,1.2,car.position.z);document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.2)+' km/sa';drawMap();if(car.position.distanceTo(marker.position)<13)document.getElementById('hint').textContent='Görev noktası: ALTIN KONVOYU';else document.getElementById('hint').textContent='A noktasına git · R: aracı sıfırla';renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setQuality(qualitySelect.value)});
</script>
</body></html>
